<!DOCTYPE html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saurabh TaskManager</title><style>
:root{--bg:#f6f8fc;--card:#fff;--text:#172033;--muted:#6b7280;--primary:#5b5ce2;--border:#e5e7eb;--ok:#138a52;--danger:#c0392b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--text)}header{background:#111827;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:3}header h1{margin:0;font-size:20px}header small{opacity:.7}.wrap{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 64px)}nav{background:#fff;border-right:1px solid var(--border);padding:16px;position:sticky;top:64px;height:calc(100vh - 64px)}nav button{width:100%;border:0;background:none;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;font-size:14px;margin-bottom:4px}nav button:hover,nav button.active{background:#eef0ff;color:var(--primary);font-weight:700}main{padding:24px;max-width:1400px;width:100%;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 2px 8px #00000008}.metric{font-size:28px;font-weight:800;margin-top:7px}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input,select,textarea{border:1px solid var(--border);border-radius:9px;padding:10px;background:#fff;width:100%}.toolbar input{max-width:360px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--primary);color:#fff;cursor:pointer;font-weight:700}.btn.secondary{background:#e9eafc;color:#3738a5}.btn.danger{background:#fff0ee;color:var(--danger)}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}th,td{padding:11px;border-bottom:1px solid var(--border);text-align:left;font-size:13px;vertical-align:top}th{background:#f8fafc}.pill{padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:11px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.show{display:flex}.modalbox{background:#fff;border-radius:16px;padding:22px;max-width:720px;width:100%;max-height:90vh;overflow:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.empty{text-align:center;padding:35px;color:var(--muted)}@media(max-width:900px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border)}nav button{min-width:max-content}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){main{padding:14px}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}}
</style></head><body><header><div><h1>🚀 Saurabh TaskManager</h1><small>SEO • AI Marketing • Career • Analytics</small></div><button class="btn secondary" onclick="openAdd()">＋ Add</button></header><div class="wrap"><nav id="nav"><button class="active" onclick="show('dashboard',this)">📊 Dashboard</button><button onclick="show('tasks',this)">✅ Tasks</button><button onclick="show('applications',this)">💼 HR Applications</button><button onclick="show('jobs',this)">🔗 LinkedIn Jobs</button><button onclick="show('emails',this)">📧 HR Emails</button><button onclick="show('events',this)">🎤 Events</button><button onclick="show('contacts',this)">👥 Contacts</button><button onclick="show('seo',this)">🔎 SEO Tools</button><button onclick="show('ai',this)">🤖 AI Tools</button></nav><main><section id="app"></section></main></div><div class="modal" id="modal"><div class="modalbox"><div style="display:flex;justify-content:space-between"><h2 id="modalTitle">Add</h2><button class="btn danger" onclick="closeModal()">✕</button></div><div id="form"></div></div></div><script>
const state={section:'dashboard',data:{}};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function api(fn,args,cb){google.script.run.withSuccessHandler(cb).withFailureHandler(e=>alert(e.message||e))[fn](args||{});}
function show(section,btn){state.section=section;document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');render();}
function render(){const a=document.getElementById('app');if(state.section==='dashboard')return dashboard(a);if(['tasks','applications','jobs','emails','events','contacts'].includes(state.section))return tablePage(a,state.section);if(state.section==='seo')return seo(a);if(state.section==='ai')return ai(a)}
function dashboard(a){a.innerHTML='<h2>Good day, Saurabh 👋</h2><p class="muted">Your unified work, career and growth command center.</p><div class="grid" id="metrics">Loading...</div><div class="card" style="margin-top:16px"><h3>Quick actions</h3><div class="toolbar"><button class="btn" onclick="openAdd('tasks')">Add Task</button><button class="btn" onclick="openAdd('applications')">Track Application</button><button class="btn" onclick="openAdd('jobs')">Add Job</button><button class="btn" onclick="openAdd('events')">Add Event</button></div></div>';api('getDashboard',{},d=>{document.getElementById('metrics').innerHTML=Object.entries(d).map(([k,v])=>`<div class="card"><div class="muted">${esc(k)}</div><div class="metric">${esc(v)}</div></div>`).join('')})}
const configs={tasks:{title:'Tasks',fn:'getRows',headers:['Task ID','Date','Task Type','Task Title','Company / Event','Status','Priority','Deadline','Follow Up Date'],fields:[['Task Title','text'],['Task Type','select','Application,Follow Up,Interview,Event,Meeting,LinkedIn,Content,SEO,AI,Other'],['Date','date'],['Company / Event','text'],['Contact Person','text'],['Email','email'],['Phone','text'],['LinkedIn URL','url'],['Location','text'],['Status','select','Pending,In Progress,Completed,Waiting,Shortlisted'],['Priority','select','High,Medium,Low'],['Deadline','date'],['Follow Up Date','date'],['Result','select','Selected,Rejected,Shortlisted,No Response,Attended,Missed,Completed,Pending'],['Notes','textarea']]},applications:{title:'HR Applications',fn:'getRows',headers:['Application ID','Application Date','Company','Job Role','HR Name','HR Email','Application Source','HR Response','Interview Date','Result','Follow Up Date'],fields:[['Company','text'],['Job Role','text'],['Application Date','date'],['Job Type','select','Full Time,Part Time,Contract,Internship'],['HR Name','text'],['HR Email','email'],['HR Phone','text'],['HR LinkedIn','url'],['Application Source','select','LinkedIn,Company Website,Naukri,Indeed,Referral,Email,Other'],['Job URL','url'],['Resume Sent','select','Yes,No'],['Mail Sent','select','Yes,No'],['Mail Date','date'],['HR Response','select','Waiting,Received,Interested,Not Interested,Need Follow Up,No Reply,Declined'],['Response Date','date'],['Interview Date','date'],['Interview Status','select','Pending,Scheduled,Completed,Cancelled'],['Result','select','Selected,Rejected,Shortlisted,No Response,Pending'],['Salary','text'],['Location','text'],['Follow Up Date','date'],['Next Action','text'],['Notes','textarea']]},jobs:{title:'LinkedIn Jobs',fn:'getRows',headers:['Job ID','Date Found','Company','Job Title','Location','Work Mode','Applied','Application Status','Priority','Follow Up Date'],fields:[['Company','text'],['Job Title','text'],['Date Found','date'],['Location','text'],['Work Mode','select','Remote,Hybrid,Onsite'],['Job Type','select','Full Time,Part Time,Contract,Internship'],['Experience','text'],['Salary','text'],['LinkedIn Job URL','url'],['Recruiter Name','text'],['Recruiter LinkedIn','url'],['Recruiter Email','email'],['Applied','select','Yes,No'],['Application Date','date'],['Application Status','select','Pending,Shortlisted,Rejected,Waiting,Interview'],['HR Response','select','Waiting,Received,Interested,Not Interested,No Reply'],['Interview Date','date'],['Result','text'],['Follow Up Date','date'],['Priority','select','High,Medium,Low'],['Notes','textarea']]},emails:{title:'HR Emails',fn:'getRows',headers:['Email ID','Date','Company','HR Name','HR Email','Job Role','Email Type','Email Status','Reply Received','Follow Up Date'],fields:[['Company','text'],['Date','date'],['HR Name','text'],['HR Email','email'],['Job Role','text'],['Subject','text'],['Email Type','select','Application,Follow Up,Thank You,Interview,Other'],['Email Status','select','Draft,Sent,Waiting,Replied'],['Reply Received','select','Yes,No'],['Reply Date','date'],['Response','textarea'],['Follow Up Required','select','Yes,No'],['Follow Up Date','date'],['Next Action','text'],['Notes','textarea']]},events:{title:'Events',fn:'getRows',headers:['Event ID','Event Date','Event Name','Organizer','Role','Acceptance','Attendance','Location','Website'],fields:[['Event Name','text'],['Event Date','date'],['Organizer','text'],['Event Type','text'],['Role','text'],['Invitation','select','Pending,Received,Accepted,Rejected'],['Registration','select','Pending,Registered,Not Registered'],['Acceptance','select','Accepted,Rejected,Pending'],['Attendance','select','Going,Not Going,Attended,Missed'],['Location','text'],['Start Time','text'],['End Time','text'],['Website','url'],['LinkedIn Event','url'],['Contact Person','text'],['Contact Email','email'],['Topic','text'],['Result','text'],['Follow Up','select','Yes,No'],['Follow Up Date','date'],['Notes','textarea']]},contacts:{title:'Contacts',fn:'getRows',headers:['Contact ID','Name','Company','Designation','Email','Phone','LinkedIn URL','Contact Type','Last Contact','Next Follow Up'],fields:[['Name','text'],['Company','text'],['Designation','text'],['Email','email'],['Phone','text'],['LinkedIn URL','url'],['Contact Type','select','HR,Recruiter,Client,Speaker,Community,Friend,Other'],['Last Contact','date'],['Next Follow Up','date'],['Relationship','text'],['Notes','textarea']]}};
function tablePage(a,key){const c=configs[key];a.innerHTML=`<h2>${c.title}</h2><div class="toolbar"><input id="q" placeholder="Search..." oninput="filterTable()"><button class="btn" onclick="openAdd('${key}')">＋ Add ${c.title.slice(0,-1)}</button><button class="btn secondary" onclick="loadTable('${key}')">↻ Refresh</button></div><div class="card" style="padding:0;overflow:auto"><table><thead><tr>${c.headers.map(h=>`<th>${h}</th>`).join('')}<th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="${c.headers.length+1}" class="empty">Loading...</td></tr></tbody></table></div>`;loadTable(key)}
function loadTable(key){api('getRows',{table:configs[key].title},rows=>{state.data[key]=rows;drawRows(key,rows)})}
function drawRows(key,rows){const c=configs[key];const body=document.getElementById('rows');if(!body)return;body.innerHTML=rows.map(r=>`<tr>${c.headers.map(h=>`<td>${esc(r[h])}</td>`).join('')}<td><button class="btn danger" onclick="del('${key}','${esc(r[c.headers[0]])}')">Delete</button></td></tr>`).join('')||`<tr><td colspan="${c.headers.length+1}" class="empty">No records yet.</td></tr>`}
function filterTable(){const key=state.section,q=(document.getElementById('q')?.value||'').toLowerCase();drawRows(key,(state.data[key]||[]).filter(r=>Object.values(r).join(' ').toLowerCase().includes(q)))}
function del(key,id){if(!confirm('Delete this record?'))return;api('deleteRow',{table:configs[key].title,id},()=>loadTable(key))}
function openAdd(key=state.section){if(!configs[key])key='tasks';const c=configs[key];document.getElementById('modalTitle').textContent='Add '+c.title.slice(0,-1);document.getElementById('form').innerHTML=`<form onsubmit="save(event,'${key}')"><div class="formgrid">${c.fields.map(([n,t,opt])=>`<label class="${t==='textarea'?'full':''}">${n}<${t==='textarea'?'textarea':t==='select'?'select':'input'} name="${n}" ${t==='date'?'type="date"':''} ${t==='url'?'type="url"':''} ${t==='email'?'type="email"':''} ${t==='select'?'required':''}>${t==='select'?opt.split(',').map(x=>`<option>${x}</option>`).join(''):''}</${t==='textarea'?'textarea':t==='select'?'select':'input'}></label>`).join('')}</div><div class="toolbar"><button class="btn">Save</button><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button></div></form>`;document.getElementById('modal').classList.add('show')}
function save(e,key){e.preventDefault();const obj=Object.fromEntries(new FormData(e.target).entries());api('addRow',{table:configs[key].title,data:obj},()=>{closeModal();if(state.section===key)loadTable(key);else show(key,document.querySelector(`nav button[onclick*="'${key}'"]`));alert('Saved successfully')})}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function seo(a){a.innerHTML='<h2>🔎 SEO Toolkit</h2><div class="grid"><div class="card"><h3>Keyword Cluster</h3><p class="muted">Generate a structured keyword brief.</p><button class="btn" onclick="seoPrompt(\'keyword\')">Open</button></div><div class="card"><h3>Meta Generator</h3><p class="muted">Create title + meta description ideas.</p><button class="btn" onclick="seoPrompt(\'meta\')">Open</button></div><div class="card"><h3>Content Brief</h3><p class="muted">Build an SEO content outline.</p><button class="btn" onclick="seoPrompt(\'brief\')">Open</button></div><div class="card"><h3>On-page Checklist</h3><p class="muted">Technical and content checklist.</p><button class="btn" onclick="seoPrompt(\'audit\')">Open</button></div></div><div class="card" style="margin-top:16px"><h3>SEO Workspace</h3><textarea id="seoInput" rows="6" placeholder="Paste keyword, page topic, URL or notes..."></textarea><button class="btn" style="margin-top:10px" onclick="seoPrompt(\'custom\')">Generate Workspace Output</button><pre id="seoOut" style="white-space:pre-wrap"></pre></div>'}
function seoPrompt(type){const x=document.getElementById('seoInput');if(x)x.value=(type==='keyword'?'Primary keyword: [enter keyword]\nTarget audience:\nSearch intent:':type==='meta'?'Page/topic:\nPrimary keyword:\nBrand name:':type==='brief'?'Topic:\nPrimary keyword:\nAudience:\nCompetitors:':type==='audit'?'URL:\nTarget keyword:\nPage type:':'');if(x)x.focus()}
function ai(a){a.innerHTML='<h2>🤖 AI Tools Hub</h2><div class="grid"><div class="card"><h3>✍️ Content Assistant</h3><p>Prompt workspace for blogs, LinkedIn and social content.</p></div><div class="card"><h3>🧠 Task Copilot</h3><p>Turn rough notes into actionable tasks.</p></div><div class="card"><h3>📧 HR Email Assistant</h3><p>Prepare application and follow-up drafts.</p></div><div class="card"><h3>📊 Growth Analyst</h3><p>Analyze KPIs and produce next-action ideas.</p></div></div><div class="card" style="margin-top:16px"><textarea id="aiPrompt" rows="8" placeholder="Enter your AI prompt or task..."></textarea><button class="btn" style="margin-top:10px" onclick="copyPrompt()">Copy Prompt</button><p class="muted">This workspace is API-ready; connect your preferred AI provider through Apps Script properties or a secure backend. No API key is stored in this repository.</p></div>'}
function copyPrompt(){navigator.clipboard.writeText(document.getElementById('aiPrompt').value);alert('Prompt copied')}
render();
</script></body></html>
